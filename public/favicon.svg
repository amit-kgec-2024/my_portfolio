<svg
  xmlns="http://www.w3.org/2000/svg"
  version="1.2"
  baseProfile="tiny-ps"
  viewBox="0 0 678 678"
  width="678"
  height="678"
>
  <title>Animated Logo</title>

  <style>
    .logo-main {
      fill: #c8f135;
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }

    .logo-inner {
      fill: #c8f135;
      animation: float 3s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.9;
        filter: drop-shadow(0 0 0px #c8f135);
      }

      50% {
        transform: scale(1.03);
        opacity: 1;
        filter: drop-shadow(0 0 25px #c8f135);
      }

      100% {
        transform: scale(1);
        opacity: 0.9;
        filter: drop-shadow(0 0 0px #c8f135);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }

      100% {
        transform: translateY(0px);
      }
    }
  </style>

